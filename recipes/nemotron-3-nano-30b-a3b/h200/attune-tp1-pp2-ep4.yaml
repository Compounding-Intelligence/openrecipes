workload:
  row_tokens: 8192
  rows: SFT conversations
  global_batch: 128
  precision: bf16
  dataset:
    name: Tulu 3 SFT mixture
    source: allenai/tulu-3-sft-mixture
    revision: b14afda60f1bbebe55d5d2fa1e4df5042f97f8be
    license: ODC-By 1.0
    rows_sha256: 8fc04d3ce32c2b2cf8b1255a84cd8627df647cb38b6cbbe69a8e6bbde0ce54c7
    build:
      name: nemotron3nano-tulu3-fixed8192-v1
      tokenizer: Nemotron-3-Nano-30B-A3B (revision bf77c3174f68ad409e1c2aa60daeb46e32d1c606; tokenizer.json sha256
        c6021eb6847e682f89aa52d5eb6e8c7d902a23acfc8137e25211cf84828f1592; chat_template.jinja sha256
        ab7813c3abdd9cb655905a410728b26c7884eca45ddfab8d9f931553485a7862)
      loss_mask: qwen3_5
      rows: 6400
      row_tokens: 8192
      padding_tokens: 0
      seed: 42
      packing: source conversations in a seeded global permutation, concatenated with an EOS token between them and cut
