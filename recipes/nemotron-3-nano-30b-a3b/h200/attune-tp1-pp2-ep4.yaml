      supervised_token_ratio: 0.665
      parquet_sha256: 7c0d4c1bd9f678b0815801a876cb8c460972424707d9f6d75883c336e1f70895
      parquet_bytes: 85528499
      builder: data/generate_fixed_sft.py with --loss-mask-type qwen3_5 (data/README.md)
