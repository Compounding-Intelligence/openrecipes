  deepep: sgl-deep-ep 0.1.2.post1 (installed; the alltoall dispatcher does not use it)
  python: 3.12.3
  network: 8 GPUs per node, EFA 1.49 (aws-ofi-nccl 1.20), 3.2 Tb/s RDMA per node
  source: 'version check of the measured run''s training image (same digest) at its build, 2026-10-17: miles and
    Megatron-LM git commits, installed TE, flash-attn, PyTorch and megatron-core; package listing and git status of the
    same image, 2026-10-18: Python, cuDNN, DeepEP, flash-attn-4, quack-kernels, clean miles and Megatron-LM checkouts;
