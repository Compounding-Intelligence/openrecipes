schema_version: 1
model: Qwen3.8-27B
gpu:
  type: H200
  memory_gb: 141
  count: 8
  per_node: 8
  instance: AWS p5en.48xlarge
author:
  name: ATTUNE
  url: https://arxiv.org/abs/2610.17528
status: verified
stack:
  framework: 'slime 0.3.0: THUDM/slime a897e1f plus 8 commits that do not change the training step'
  megatron_lm: commit 1dcf0daf (megatron-core 0.16.0rc0), with a backported upstream fix for the Qwen3.5 attention output
    gate at TP above the query-group count
  transformer_engine: 2.10.0
  pytorch: 2.11.0 (CUDA 12.9 build)
  cuda: '12.9'
  nccl: 2.28.9 (CUDA 12.9 build; printed by the measured run)
  deepep: 1.2.1
  python: '3.12'
  network: 8 GPUs per node, EFA, 3.2 Tb/s RDMA per node
  source: 'in-pod environment dump of the measured run''s training image (same digest), taken by the component tests on 2026-10-11:
    installed TE, PyTorch and DeepEP, Megatron-LM git commit; NCCL from the measured run''s log'
workload:
  row_tokens: 8192
  rows: SFT conversations
  global_batch: 128
  precision: bf16
  dataset:
    name: Tulu 3 SFT mixture
    source: allenai/tulu-3-sft-mixture
    revision: b14afda60f1bbebe55d5d2fa1e4df5042f97f8be
    license: ODC-By 1.0
    rows_sha256: ee1486b28ce21df721ad61c2d3765c64a29eed0eb5680ede005bd6a321dc1a1e
    build:
      name: qwen38-tulu3-fixed8192-v1
      tokenizer: Qwen3.8 (the Qwen3.8-27B tokenizer; tokenizer.json sha256 0997f410c57a1f4e53b09e4be8f4a172d90edd9564368fb0847030937229b9f3)
      loss_mask: qwen3_5
      rows: 6400
      row_tokens: 8192
      padding_tokens: 0
      seed: 42
      packing: source conversations in a seeded global permutation, concatenated with an EOS token between them and cut into
        consecutive 8,192-token rows; rows without supervised targets are skipped
      supervised_token_ratio: 0.642
      parquet_sha256: a7b7b4db98e95152604a77bcf09b51502d2266ba04de98409cef6b97afd039c8
      parquet_bytes: 76722714
      builder: data/generate_fixed_sft.py (data/README.md)
layout:
  label: TP4 PP2
  summary: TP 4, PP 2 (32 layers per stage), CP 1, DP 1, sequence parallel; one 8,192-token row per microbatch; no recompute;
    CPU optimizer offload with overlapped copies and the precision-aware optimizer; dense model, no experts
  highlights: max 8,192 tokens/GPU, no recompute, CPU optimizer offload
  tp: 4
  pp: 2
  vpp: 1
  cp: 1
  ep: 1
  etp: 1
  dp: 1
  sequence_parallel: true
  layer_split: null
  max_tokens_per_gpu: 8192
  rows_per_microbatch: 1
  recompute: null
  offload:
    optimizer_fraction: 1.0
    overlap_d2h_h2d: true
  dispatcher: null
result:
  tokens_per_s_per_gpu: 1194.3
  usd_per_million_tokens: 1.84
  step_time_cv_percent: 1.89
  mfu: 0.1857
  mfu_note: null
  active_params:
    count: 25623920640
    source: https://huggingface.co/Qwen/Qwen3.8-27B
