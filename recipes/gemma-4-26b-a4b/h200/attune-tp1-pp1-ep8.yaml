run: |
  export CUDA_DEVICE_MAX_CONNECTIONS=1
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

  MODEL_ARGS_LINE="$(python3 miles/utils/external_utils/model_args_utils.py gemma-4-26b-a4b-it)"
  read -ra MODEL_ARGS <<< "$MODEL_ARGS_LINE"
  python3 train.py \
    --actor-num-nodes 1 \
    --actor-num-gpus-per-node 8 \
    --num-gpus-per-node 8 \
    "${MODEL_ARGS[@]}" \
    --hf-checkpoint "$HF_CKPT" \
    --ref-load "$HF_CKPT" \
    --megatron-to-hf-mode bridge \
    --loss-type sft_loss \
    --calculate-per-token-loss \
    --disable-compute-advantages-and-returns \
    --debug-train-only \
    --rollout-function-path pretokenized_sft_rollout.generate_rollout \
    --prompt-data "$SFT_DATA" \
    --input-key messages \
    --metadata-key metadata \
    --num-rollout 20 \
    --rollout-batch-size 128 \
    --global-batch-size 128 \
    --tensor-model-parallel-size 1 \
    --pipeline-model-parallel-size 1 \
    --context-parallel-size 1 \
    --expert-model-parallel-size 8 \
    --expert-tensor-parallel-size 1 \
    --recompute-granularity selective \
    --micro-batch-size 1 \
    --max-tokens-per-gpu 1024 \
    --optimizer adam --lr 1e-5 --lr-decay-style cosine --min-lr 1e-6 \
    --lr-warmup-fraction 0.1 --weight-decay 0.1 --adam-beta1 0.9 --adam-beta2 0.98 \
    --attention-dropout 0.0 --hidden-dropout 0.0 \
    --accumulate-allreduce-grads-in-fp32 \
    --no-gradient-accumulation-fusion \
    --no-check-for-nan-in-loss-and-grad \
    --attention-softmax-in-fp32 \
    --attention-backend auto \
    --qkv-format bshd \
    --distributed-timeout-minutes 30 \
    --log-probs-chunk-size 1024 \
    --recompute-modules core_attn moe
notes: |
  - Starting point: miles' Gemma-4-26B-A4B launcher, `scripts/run_gemma_4_26b_a4b.py` at miles 0.1.0 (model page
    https://miles.radixark.com/docs/models/gemma/gemma-4). miles publishes it as a GRPO recipe with no tokens/s figure.
    Ported to this workload with its layout (TP 4 with sequence parallel, EP 8, TE's unfused attention) on 8 H200, with
    selective recompute of the core attention and one row per microbatch, it measured 1,878.2 tokens/s/GPU; ATTUNE
    tuned it to 4,023.2 (+114%).
  - TP 1 fits with both `--recompute-modules core_attn moe` and `--log-probs-chunk-size 1024`. With the core attention
    recomputed alone, a tuning run ran out of memory at step 0 in the FP32 logits of the 262,144-token vocabulary
    (8 GiB per row); with chunked log-probs but no MoE recompute, another ran out at step 1 in the expert activations.
  - At step 0 the loss on the first 128 rows is 4.28773, against 4.28841 for the reference recipe; Hugging Face
    transformers 5.12.1 gives 4.28956 on the same rows.
  - The convergence check covers 20 steps. This recipe runs cuDNN fused attention on the sliding-window layers, where
    the reference recipe runs TE's unfused attention, and on another MoE model cuDNN fused attention passed the 20-step
    check while its loss drifted up later (ATTUNE's lever catalog). Compare the loss over a longer run before a full
    training run.
