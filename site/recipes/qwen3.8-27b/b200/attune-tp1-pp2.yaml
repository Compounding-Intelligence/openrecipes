env:
  CUDA_DEVICE_MAX_CONNECTIONS: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TORCHINDUCTOR_COMPILE_THREADS: '1'
  NCCL_NVLS_ENABLE: $([ "$NVLINK_COUNT" -gt 0 ] && echo 1 || echo 0)
patches:
- patches/fla_blackwell_guard.py
run: |
  export CUDA_DEVICE_MAX_CONNECTIONS=1
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  export TORCHINDUCTOR_COMPILE_THREADS=1
  export NCCL_NVLS_ENABLE=$([ "$NVLINK_COUNT" -gt 0 ] && echo 1 || echo 0)

  python3 -m <slime entry module> --async \
    --actor-num-nodes 1 \
    --actor-num-gpus-per-node 8 \
    ${MODEL_ARGS[@]} \
    --hf-checkpoint "$HF_CKPT" \
    --ref-load "$TORCH_DIST" \
    --rollout-function-path pretokenized_sft_rollout.generate_rollout \
    --prompt-data "$SFT_DATA" \
    --input-key messages \
    --metadata-key metadata \
    --num-rollout 20 \
    --rollout-batch-size 128 \
    --global-batch-size 128 \
    --loss-type sft_loss \
    --loss-mask-type qwen3_5 \
    --calculate-per-token-loss \
    --disable-compute-advantages-and-returns \
    --debug-train-only \
    --tensor-model-parallel-size 1 \
    --pipeline-model-parallel-size 2 \
    --decoder-last-pipeline-num-layers 30 \
    --context-parallel-size 1 \
    --expert-model-parallel-size 1 \
    --expert-tensor-parallel-size 1 \
    --sequence-parallel \
    --recompute-granularity full \
    --recompute-method uniform \
    --recompute-num-layers 1 \
    --use-dynamic-batch-size \
    --max-tokens-per-gpu 8192 \
    --optimizer adam --lr 1e-5 --lr-decay-style cosine --min-lr 1e-6 \
    --lr-warmup-fraction 0.1 --weight-decay 0.1 --adam-beta1 0.9 --adam-beta2 0.98 \
    --use-distributed-optimizer \
    --use-precision-aware-optimizer \
    --attention-dropout 0.0 --hidden-dropout 0.0 \
    --accumulate-allreduce-grads-in-fp32 --attention-softmax-in-fp32 \
    --attention-backend flash \
    --distributed-timeout-minutes 30 \
    --tensorboard-dir "$PROFILE_DIR"
notes: |
  - Starting point: slime's Qwen3.5-27B script, `scripts/run-qwen3.5-27B.sh` with `scripts/models/qwen3.5-27B.sh` at
    slime 0.3.0. slime ships it as a 4-node GRPO script and publishes no tokens/s figure for it. Ported to this
    workload on one 8-GPU node with its layout (TP 4 with sequence parallel, PP 2 with 34/30 layers, CP 1 in place of
    its CP 4, full recompute, Adam on the CPU), it measured 1,411.1 tokens/s/GPU on 8 B200; ATTUNE tuned it to 3,858.5
    (+173%).
  - Recompute stays on: the tuning runs without it ran out of memory on the first stage at TP 4 and TP 2 with PP 2
    (162.7 and 165.8 GiB allocated of 178 GiB).
  - B200 runs of this model need `patches/fla_blackwell_guard.py`: with the image's Triton 3.6, FLA 0.4.1's autotuner
    picks gated-delta-net kernel configs that race on Blackwell and give a different, wrong result on every call, and
    the patch keeps those kernels on the configs FLA main uses there. Every training process imports it before FLA
    (patches/README.md) and prints a `[fla-guard]` line.
