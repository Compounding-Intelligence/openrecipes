      FP32 masters, the TE remainder self-test passes and the negative controls fail
    note: run on B200 on this recipe's training image; the optimizer step is elementwise, so the result holds for every
      model on the image
  convergence:
    steps: 20
    result: pass
    correlation: 0.9999987
    final_loss_difference: 2.9e-05
    pointwise_failures: 0
    note: 'candidate arm: the measured run; reference arm: a 20-step run of the reference recipe on the same image and
