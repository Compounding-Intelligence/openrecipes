    note: run on this recipe's training image (the same image configuration); the optimizer step is elementwise, so the
      result holds for every model on the image
  convergence:
    steps: 20
    result: pass
    correlation: 0.9999998
    final_loss_difference: 0.00012
    pointwise_failures: 0
