env:
  NCCL_GRAPH_REGISTER: '0'
  NCCL_NVLS_ENABLE: '0'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TORCH_NCCL_AVOID_RECORD_STREAMS: '1'
  TORCH_NCCL_HIGH_PRIORITY: '1'
  AUTOTUNE_SEQ_LEN: '8192'
  PARITY_PROBE: '0'
patches:
- patches/attune_gpt_oss_yarn.py
run: |
  MODEL_ARGS=(
    --spec attune_gpt_oss_yarn get_gpt_oss_yarn_spec
    --num-layers 24 --hidden-size 2880 --ffn-hidden-size 2880
    --num-attention-heads 64 --group-query-attention --num-query-groups 8 --kv-channels 64
    --padded-vocab-size 201088 --tokenizer-type HuggingFaceTokenizer
    --normalization RMSNorm --norm-epsilon 1e-5 --untie-embeddings-and-output-weights
    --position-embedding-type rope --rotary-percent 1.0 --rotary-base 150000 --no-rope-fusion
    --num-experts 32 --moe-ffn-hidden-size 2880 --moe-router-topk 4 --moe-router-score-function softmax
    --moe-grouped-gemm --quick-geglu --glu-linear-offset 1.0 --activation-func-clamp-value 7.0
    --softmax-type learnable --window-attn-skip-freq 2 --window-size 127,0
  )
  export NCCL_GRAPH_REGISTER=0 NCCL_NVLS_ENABLE=0 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  export TORCH_NCCL_AVOID_RECORD_STREAMS=1 TORCH_NCCL_HIGH_PRIORITY=1
  export AUTOTUNE_SEQ_LEN=8192 PARITY_PROBE=0

  python3 -m <slime entry module> --async \
    --actor-num-nodes 1 --actor-num-gpus-per-node 8 \
    ${MODEL_ARGS[@]} \
    --seq-length 8192 \
    --hf-checkpoint $HF_CKPT --ref-load $TORCH_DIST \
    --rollout-function-path pretokenized_sft_rollout.generate_rollout \
    --prompt-data $SFT_DATA --input-key messages --metadata-key metadata \
    --num-rollout 20 --rollout-batch-size 128 --global-batch-size 128 \
    --loss-type sft_loss --disable-compute-advantages-and-returns --debug-train-only \
    --tensor-model-parallel-size 1 --pipeline-model-parallel-size 1 \
    --context-parallel-size 1 --expert-model-parallel-size 8 --expert-tensor-parallel-size 1 \
    --use-dynamic-batch-size --max-tokens-per-gpu 16384 --recompute-granularity selective --recompute-modules moe_act \
    --moe-router-load-balancing-type none --moe-aux-loss-coeff 0.0 \
    --moe-token-dispatcher-type alltoall --moe-permute-fusion --no-bias-dropout-fusion \
    --cross-entropy-loss-fusion --cross-entropy-fusion-impl native \
    --attention-dropout 0.0 --hidden-dropout 0.0 \
    --optimizer adam --lr 5e-6 --min-lr 0 --lr-decay-style cosine --lr-warmup-iters 10 --lr-decay-iters 100 \
    --adam-beta1 0.9 --adam-beta2 0.98 --adam-eps 1e-8 --clip-grad 1.0 \
    --weight-decay 0.033 --weight-decay-incr-style constant \
    --use-distributed-optimizer --grad-reduce-in-bf16 --seed 5678
