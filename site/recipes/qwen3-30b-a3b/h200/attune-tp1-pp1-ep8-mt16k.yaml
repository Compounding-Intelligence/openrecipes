env:
  CUDA_DEVICE_MAX_CONNECTIONS: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
patches: []
run: |
  export CUDA_DEVICE_MAX_CONNECTIONS=1
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False

  MODEL_ARGS_LINE="$(python3 miles/utils/external_utils/model_args_utils.py qwen3-30B-A3B)"
  read -ra MODEL_ARGS <<< "$MODEL_ARGS_LINE"
  python3 train.py \
    --actor-num-nodes 1 \
    --actor-num-gpus-per-node 8 \
    --num-gpus-per-node 8 \
    "${MODEL_ARGS[@]}" \
    --hf-checkpoint "$HF_CKPT" \
    --ref-load "$TORCH_DIST" \
    --loss-type sft_loss \
    --calculate-per-token-loss \
    --disable-compute-advantages-and-returns \
    --debug-train-only \
    --rollout-function-path pretokenized_sft_rollout.generate_rollout \
    --prompt-data "$SFT_DATA" \
    --input-key messages \
    --metadata-key metadata \
    --num-rollout 20 \
    --rollout-batch-size 128 \
    --global-batch-size 128 \
    --tensor-model-parallel-size 1 \
    --pipeline-model-parallel-size 1 \
    --context-parallel-size 1 \
    --expert-model-parallel-size 8 \
    --expert-tensor-parallel-size 1 \
    --recompute-granularity full \
    --recompute-method uniform \
    --recompute-num-layers 1 \
    --use-dynamic-batch-size \
    --max-tokens-per-gpu 16384 \
    --optimizer adam --lr 1e-5 --lr-decay-style cosine --min-lr 1e-6 \
    --lr-warmup-fraction 0.1 --weight-decay 0.1 --adam-beta1 0.9 --adam-beta2 0.98 \
    --use-precision-aware-optimizer \
    --attention-dropout 0.0 --hidden-dropout 0.0 \
    --accumulate-allreduce-grads-in-fp32 --attention-softmax-in-fp32 \
    --attention-backend flash \
    --distributed-timeout-minutes 30
notes: |
  - Starting point: miles' Qwen3-30B-A3B launcher, `scripts/run_qwen3_30b_a3b.py` at miles 0.1.0 (model page
    https://miles.radixark.com/docs/models/qwen/qwen3-moe). miles publishes it as a GRPO recipe with no tokens/s figure.
    Ported to this workload with its one-node layout (TP 4 with sequence parallel, EP 8, full recompute, max 32,768
    tokens/GPU, Adam on the CPU) on 8 H200, it measured 3,129.7 tokens/s/GPU; ATTUNE tuned it to 6,913.2 (+121%).
  - miles empties the CUDA cache after every step (`train.py` calls `clear_memory`, which runs `torch.cuda.empty_cache`),
    so the caching allocator acquires its memory again each step. With `PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False`
    the step took 19.0 s, against 20.8 s with expandable segments in an otherwise identical tuning run (6,296.3
    tokens/s/GPU).
  - Keep the full recompute: tuning runs with recompute off and with selective recompute ran out of memory at step 0 at
    two rows per microbatch.
